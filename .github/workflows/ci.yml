name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_estetica
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/app_estetica
      AUTH_SECRET: ci-only-secret-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_NAME: Belleza Local
      CRON_SECRET: ci-cron-secret-at-least-32-characters
      FEATURE_PRODUCTS: "false"
      FEATURE_BONOS: "false"
      FEATURE_BEAUTY_CONCIERGE: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_estetica
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d app_estetica"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to clean PostgreSQL
        shell: bash
        run: |
          set -o pipefail
          npx prisma migrate deploy 2>&1 | tee migration.log

      - name: Upload migration diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-diagnostics
          path: migration.log
          if-no-files-found: error
          retention-days: 3

      - name: Verify migration state
        run: npx prisma migrate status

      - name: Lint
        run: npm run lint

      - name: Type check
        shell: bash
        run: |
          set -o pipefail
          npm run type-check 2>&1 | tee typecheck.log

      - name: Unit and integration tests
        shell: bash
        run: |
          set -o pipefail
          npm test -- --run 2>&1 | tee tests.log

      - name: Production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload quality diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics
          path: |
            typecheck.log
            tests.log
            build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Install Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test@1.52.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser end-to-end tests
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
